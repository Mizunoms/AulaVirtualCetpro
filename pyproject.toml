[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore:No directory at:UserWarning"]

[tool.ruff]
line-length = 130
target-version = "py312"
# aceptacion/guiones son las pruebas HTTP del sistema anterior, copiadas casi tal cual: no se les cambia el estilo
extend-exclude = ["migrations", "aceptacion/guiones"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]
# Los textos de pantalla en español pueden ser largos: el formateador acomoda el código, no se parten frases.
ignore = ["E501", "DJ012"]
